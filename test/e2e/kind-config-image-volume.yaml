kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # ImageVolumeSource requires Kubernetes 1.35+.
    image: kindest/node:v1.35.0
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      - containerPort: 30320
        hostPort: 30320
        protocol: TCP
