# Scopes the ConfigMap validating webhook to the single namespace the
# controller watches (where Beyla writes its state ConfigMaps). This is what
# makes failurePolicy: Fail safe: an outage of the validator can only block
# ConfigMap writes in this one namespace, never cluster-wide.
#
# The annotation that marks a ConfigMap as injection config is not selectable
# by namespaceSelector/objectSelector, so a CEL matchCondition below narrows
# the webhook to ConfigMaps that carry it. The handler still inspects the
# annotation in-code, which is what keeps clusters without matchConditions
# support safe (there the webhook fires for every ConfigMap in the namespace).
#
# NOTE: the namespace name below must match the install namespace (the
# `namespace:` value in config/default/kustomization.yaml) and the controller's
# WATCH_NAMESPACE. Update all three together if you relocate the controller.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
  - name: vconfigmap-v1.beyla.grafana.com
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: beyla-k8s-injector
    # Exclude the cluster-managed kube-root-ca.crt ConfigMap so failurePolicy:
    # Fail never blocks the kube-controller-manager from publishing it into the
    # watched namespace — which would deadlock a fresh install when that
    # namespace is also the controller's own (the pod can't start without
    # kube-root-ca.crt). CEL matchConditions are GA in k8s 1.30 (beta, on by
    # default, in 1.28/1.29). On clusters < 1.28 use the Helm chart (which
    # enforces a separate watchNamespace) or ensure watchNamespace differs from
    # the controller namespace.
    matchConditions:
      - name: exclude-kube-root-ca
        expression: "object.metadata.name != 'kube-root-ca.crt'"
      # Only ConfigMaps the controller consumes reach the validator: those with
      # the Beyla selector annotation on the new object, or on the old object
      # when an UPDATE removes it. Everything else in the namespace is admitted
      # without a webhook call, so an unreachable controller cannot block
      # unrelated ConfigMap writes. A CEL error follows failurePolicy (Fail).
      # Keep the key equal to configmap.SelectorAnnotation and to the Helm
      # chart (charts/k8s-injection-controller/templates/webhook/webhook-configuration.yaml).
      - name: only-injection-configmaps
        expression: >-
          (has(object.metadata.annotations) && 'beyla.grafana.com/node' in object.metadata.annotations) ||
          (oldObject != null && has(oldObject.metadata.annotations) && 'beyla.grafana.com/node' in oldObject.metadata.annotations)
